    <circle cx="165" cy="170" r="62" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.26"/>
    <g fill="#171511" stroke="url(#gold)" stroke-width="1.6">
      <path d="M165 93 L177 201 L165 228 L153 201 Z"/>
      <path d="M153 157 L75 187 L56 201 L153 185 Z"/>
      <path d="M177 157 L255 187 L274 201 L177 185 Z"/>
      <path d="M160 216 L137 237 L163 228 Z"/>
      <path d="M170 216 L193 237 L167 228 Z"/>
      <path d="M165 93 L165 70 L171 91 Z" fill="url(#gold)"/>
    </g>
    <path d="M165 93 L170 129 L165 139 L160 129 Z" fill="url(#gold)"/>
    <path d="M82 270 Q165 302 248 270" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <path d="M106 281 Q165 305 224 281" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>
    <g stroke="#D4AF37" stroke-opacity="0.52">
      <path d="M12 32 L32 12 M12 44 L44 12"/>
      <path d="M318 32 L298 12 M318 44 L286 12"/>
      <path d="M12 298 L32 318 M12 286 L44 318"/>
      <path d="M318 298 L298 318 M318 286 L286 318"/>
